# Deploys production when a change to versions.env (or the stack files) is merged to main,
# or when someone presses "Run workflow". Only one deploy runs at a time.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         server IP or hostname
#   DEPLOY_SSH_KEY      private key whose public half is in /home/deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <server>
# Optional: protect the "production" environment with required reviewers so every
# deploy waits for an approval click.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - versions.env
      - compose.yaml
      - Caddyfile
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
    timeout-minutes: 20
    env:
      TARGET: deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the stack file
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose --env-file versions.env --env-file .env config --quiet
          rm .env

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: Upload stack files
        # Only these files are copied. .env, backups and models on the server are untouched.
        run: |
          rsync -az --chmod=D750,F640 compose.yaml Caddyfile versions.env .env.example "$TARGET:/opt/viweb/"
          rsync -az --chmod=D750,F750 scripts/ "$TARGET:/opt/viweb/scripts/"

      - name: Deploy
        run: ssh "$TARGET" /opt/viweb/scripts/deploy.sh

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          grep _TAG versions.env | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
